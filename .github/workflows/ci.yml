name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Sync the locked development environment
        run: uv sync --locked --group dev --all-extras

      - name: Lint Python sources
        run: uv run --locked ruff check src scripts tests

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts tests

      - name: Run tests
        run: uv run --locked python -m pytest -q

      - name: Check installed dependencies
        run: uv pip check

      - name: Audit the locked dependency graph
        run: |
          uv export \
            --locked \
            --all-extras \
            --all-groups \
            --no-emit-project \
            --output-file audit-requirements.txt
          uv run --locked pip-audit \
            --requirement audit-requirements.txt \
            --disable-pip \
            --no-deps \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-3447
