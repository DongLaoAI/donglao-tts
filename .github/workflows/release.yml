name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(uv version --short)"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "release tag '$RELEASE_TAG' must equal '$expected'" >&2
            exit 1
          fi

      - name: Test the tagged source with the lockfile
        run: |
          uv sync --locked --group dev --all-extras
          uv run --locked ruff check src scripts tests
          uv run --locked pytest -q
          uv pip check
          uv export \
            --locked \
            --all-extras \
            --all-groups \
            --no-emit-project \
            --output-file audit-requirements.txt
          uv run --locked pip-audit \
            --requirement audit-requirements.txt \
            --disable-pip \
            --no-deps \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-3447

      - name: Install packaging tools
        run: >-
          python -m pip install
          "build==1.3.0"
          "check-wheel-contents==0.6.3"
          "twine==6.2.0"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Inspect wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Store immutable release artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  artifact-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Download the exact release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test package and every console command
        run: |
          python -c "import donglao_tts; print(donglao_tts.__version__)"
          donglao-train --help
          donglao-infer --help
          donglao-onnx-infer --help
          donglao-push-to-hub --help
          donglao-prepare-dataset --help
          donglao-compile-dataset --help
          donglao-phonemize-manifest --help
          donglao-build-phoneme-corpus --help
          donglao-build-tokenizer --help
          donglao-init-config --help
          donglao-smoke-test-hub --help

  publish-testpypi:
    needs:
      - build
      - artifact-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/donglao-tts/
    permissions:
      id-token: write

    steps:
      - name: Download the tested release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs:
      - build
      - artifact-smoke-test
      - publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/donglao-tts/
    permissions:
      id-token: write

    steps:
      - name: Download the tested release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
